# `make dev-up` starts only Postgres, the one service the API needs.
# Optional services start with: docker compose -f infra/local/docker-compose.yml --profile optional up -d
services:
  postgres:
    image: postgres:16.4
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not used by the API today.
  redis:
    image: redis:7.4.0
    profiles: ["optional"]
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Only needed with ASSET_STORAGE_BACKEND=s3|minio. MinIO no longer publishes
  # minio/minio publicly on Docker Hub (verified 2026-10-06), so this tag may
  # not pull; set MINIO_IMAGE to an image you can access.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-07-16T23-46-41Z}
    profiles: ["optional"]
    container_name: atlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlasminio
      MINIO_ROOT_PASSWORD: atlasminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # SMTP catcher (multi-arch MailHog replacement). Not used by the API today.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["optional"]
    container_name: atlas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
